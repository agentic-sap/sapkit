# Offline structure/integrity/safety gates (S3 · D-027 로드맵 §9.7).
#
# 원칙: 여기 있는 게이트는 **assert**한다. 상태를 출력만 하고 항상 exit 0인 게이트는
# 안전 표면이 회귀해도 초록이라 없느니만 못하다(로드맵 §15).
#
# S3에서 달라진 것:
#   - check-migration-coverage(외부 sc4sap-custom 절대경로를 재귀 순회 → 러너에 없어 크래시,
#     그래서 CI 제외였다)를 **폐기**하고 check-migration-snapshot으로 교체했다. 새 게이트는
#     고정 스냅샷만 읽어 원본 없이 돌므로 **드디어 CI에서 실행된다**.
#   - smoke-mcp가 관찰에서 assertion으로 바뀌었다.
#   - 엔진 소스 테스트 599개와 provenance 검사를 편입했다.
#
# 여전히 CI에 없는 것 (러너에 존재하지 않는 상태를 읽음 — 로컬 전용):
#   - doctor.mjs → 설치된 CLI 버전·플러그인 설치·훅 배선을 본다. 러너엔 무의미.
#   - build-migration-snapshot / report-sc4sap-public-drift → 동결 원본이 필요하다.
#   - Track A의 실제 verify(살아있는 SAP 대상 vsp) → 자격증명·네트워크 부재. 로컬/에스코트 전용.
name: offline-gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-engine-provenance가 `git log -1 -- engine/src …`로 번들 소스 최종 커밋을
          # 찾는다. 얕은 클론(기본 depth 1)이면 이력이 없어 오판한다.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 이식 provenance (pinned snapshot · 원본 무접촉 · private 열거 0)
        run: node interactive/scripts/check-migration-snapshot.mjs

      - name: 이식 게이트 음성시험 (게이트가 실제로 거부하는지)
        run: node interactive/scripts/test-check-migration-snapshot.mjs

      - name: check-links
        run: node interactive/scripts/check-links.mjs interactive

      - name: 번들 무결성 (VERSION ↔ integrity.json ↔ 바이트)
        run: node interactive/server/verify-engine.mjs

      - name: 엔진 provenance (소스 커밋 ↔ 번들)
        run: node interactive/scripts/check-engine-provenance.mjs

      - name: MCP 도구 표면 계약 (readonly mutation 0 · row-data · 어댑터 deny)
        run: node interactive/scripts/smoke-mcp.mjs

      - name: 표면 게이트 음성시험
        run: node interactive/scripts/test-smoke-mcp.mjs

      # ── 서버 자체 안전 게이트 (설계 2026-08-02-claude-onboarding… §7-2 · §14-1) ──
      # 훅이 기본 0개가 되면 안전의 정본은 서버 번들뿐이다(R-RUNTIME). smoke-mcp가
      # "무엇이 보이는가"(tools/list 이름 집합)를 고정한다면, 아래 둘은 "보이는 것을
      # **호출하면** 서버가 막는가"를 고정한다.
      #
      # 러너에서 안전한 이유: 임시 HOME/USERPROFILE + 임시 프로파일 fixture만 쓰고,
      # 상속 env의 SAP_*/MCP_*/SAPKIT_*/SC4SAP_*를 지운 뒤 번들을 띄운다. 대상 SAP은
      # `http://127.0.0.1:1`(아무도 listen하지 않는 루프백)이라 게이트를 통과한 호출은
      # 즉시 ECONNREFUSED로 끝난다 — 그 차이가 "막혔다 vs SAP로 나갔다"의 증거다.
      # 자격증명·네트워크 없이 도는 오프라인 게이트이므로 OS 의존이 없다.
      - name: 서버 안전 게이트 적합성 (tier · blocklist · inspection-only 정직 실패)
        run: node interactive/scripts/conformance-server-gates.mjs

      # 훅은 기본 미설치지만 **되돌릴 스위치**가 곧 안전 기능이다(R-SWITCH).
      # 스위치가 손상된 채 출시되는 것은 설계 §14-3의 출시 불가 조건이다.
      - name: 훅 스위치 왕복 (install-hooks 설치·제거 멱등 · 타 설정 보존 · 밖 무접촉)
        run: node interactive/scripts/test-hook-switch.mjs

      # ── setup·패키징 결정론 (설계 §8-2 · §6 방식 ④ — 2026-08-02) ─────────────
      # 셋 다 임시 디렉터리 fixture만 쓰는 오프라인 시험이다. setup-state는 홈을
      # SAPKIT_HOME_DIR 스텁으로 격리하고, codex-wire는 가짜 캐시 트리로 재작성을
      # 검증하며, launch-toolsurface는 자식 env에서 실사용자 홈 변수를 지운다.
      - name: setup 상태 mutator 음성시험 (byte-noop · 비밀 거부 · 부분 실패 롤백)
        run: node interactive/scripts/test-setup-state.mjs

      - name: launcher toolSurface 음성시험 (fail-closed 표 · 인자 우선순위)
        run: node interactive/scripts/test-launch-toolsurface.mjs

      - name: Codex wrapper 배선 도구 음성시험 (토큰 치환 · 멱등 · 스테일 수리)
        run: node interactive/scripts/test-codex-wire-mcp.mjs

      # ── 런타임 경로 개명 `.sc4sap` → `.sapkit` (D-057 · 설계 §7-2·§7-3) ──────
      # 셋 다 오프라인이고 러너에 있는 상태만 읽는다. 적합성 러너는 임시 트리에서
      # 실물 소비자(리졸버·훅 2종·launch shim·vpass·extract)를 구동하며,
      # launch 실기동 스모크는 프로필이 없는 cwd라 SAP에 접속하지 않는다.
      - name: 런타임 경로 개명 게이트 (활성 구역 무누출 · 폴백 의무 · 안전 앵커)
        run: node interactive/scripts/check-runtime-path-rename.mjs

      - name: 개명 게이트 음성시험 (토큰 주입·앵커 제거·폴백 파괴를 실제로 거부하는지)
        run: node interactive/scripts/test-check-runtime-path-rename.mjs

      # test-migrate-runtime-dir는 journal 계약을 엔진 리더(engine/dist/lib/profile.js)로
      # 직접 확증한다(설계 의도: dist 부재 시 skip이 아니라 fail). dist의 외부 require는
      # dotenv 하나뿐인데 engine dependencies가 아니라 devDep 트리로만 존재해(번들은
      # esbuild 내장) 무설치 러너에서 MODULE_NOT_FOUND가 났다(run #62·#63 — D-060).
      # 전체 npm ci 대신 lockfile 핀 버전만 스크래치에 깔고 NODE_PATH(CJS require의
      # 최종 폴백)로 공급한다 — 엔진 트리 재해석 0, 시험 약화 0.
      - name: 엔진 리더 probe 의존성 (dotenv — dist 유일 외부 require)
        run: |
          DV=$(node -p "require('./engine/package-lock.json').packages['node_modules/dotenv'].version")
          npm install --prefix "$RUNNER_TEMP/probe-deps" --no-save --no-package-lock --no-audit --no-fund --ignore-scripts "dotenv@$DV"
          echo "NODE_PATH=$RUNNER_TEMP/probe-deps/node_modules" >> "$GITHUB_ENV"

      - name: 마이그레이터 음성시험 (목적지 존재·symlink·divergence 거부 · journal 계약)
        run: node interactive/scripts/test-migrate-runtime-dir.mjs

      - name: 런타임 경로 적합성 (소비자별 현행 의미 보존 · 안전 회귀 9종)
        run: node interactive/scripts/conformance-runtime-dir.mjs

      - name: 플러그인 매니페스트·MCP 생성물 7종 ↔ 단일 정본
        run: node interactive/scripts/gen-plugin-manifests.mjs --check

      - name: git diff --check (공백/충돌 마커)
        run: git diff --check HEAD

  engine-tests:
    # 엔진 소스 테스트 599개 (§9.3). 번들 바이트만 검사하면 소스 회귀를 못 본다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: install (engine)
        working-directory: engine
        # HUSKY=0: husky는 개발자 훅 설치용이라 러너에서 불필요.
        # patch-package는 그대로 돌아야 한다 — 벤더링된 ADT 클라이언트 패치가 소스 계약의 일부다.
        env:
          HUSKY: '0'
        run: npm ci

      - name: unit/offline tests
        working-directory: engine
        # SAP 자격증명이 없으므로 integration 스위트는 스스로 skip한다
        # (tests/test-config.yaml은 gitignore 대상 — 로컬에서도 부재 상태로 599 passed 실측).
        run: npm test -- --runInBand

      - name: 번들 재현 빌드 (같은 커밋 → 같은 바이트)
        # devDeps(esbuild/tsc)가 깔린 이 잡에서만 가능하다.
        run: node interactive/scripts/check-engine-provenance.mjs --rebuild

  ps-gate:
    # Track A 검사기들은 ENGINE이 실제로 부르는 방식(Windows powershell.exe, 역슬래시 경로)
    # 그대로 돌려야 의미가 있어 windows-latest다.
    #
    # ⚠️ 반드시 `-File`로 띄운다. `powershell -Command`는 자식 종료코드를 0/1로 뭉개는데
    # (2026-07-16 실측 · 로드맵 §13), 이 스위트들은 64/65/66/67을 구분해야 한다.
    # GitHub의 `shell: powershell`은 -Command라서 쓰지 않고 cmd에서 -File로 호출한다.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: review-verdict 검사기 테스트 (run-scoped 계약)
        shell: cmd
        run: powershell -NoProfile -File .\scripts\test-check-review-verdict.ps1

      - name: run-track-a wrapper 음성시험 (legacy deny · fail-closed)
        shell: cmd
        run: powershell -NoProfile -File .\scripts\test-run-track-a.ps1

      - name: Track B -> Guided bridge 테스트
        shell: cmd
        run: powershell -NoProfile -File .\scripts\test-promote-track-b-run.ps1

  win-migrate-gate:
    # test-migrate-runtime-dir.mjs의 win32 전용 DACL 검증 블록(§5 ⑼)은
    # `process.platform === 'win32'`일 때만 돈다 — node-gates(ubuntu-latest)에서는
    # 항상 스킵된다. 그 경로를 CI에서 실제로 통과시키는 잡.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # node-gates의 동일 스텝 참조 (D-060) — 엔진 리더 probe가 요구하는 dotenv를
      # lockfile 핀 버전으로 스크래치 공급. windows 러너 기본 셸(pwsh) 문법.
      - name: 엔진 리더 probe 의존성 (dotenv — dist 유일 외부 require)
        run: |
          $dv = node -p "require('./engine/package-lock.json').packages['node_modules/dotenv'].version"
          $dir = Join-Path $env:RUNNER_TEMP 'probe-deps'
          npm install --prefix $dir --no-save --no-package-lock --no-audit --no-fund --ignore-scripts "dotenv@$dv"
          "NODE_PATH=$dir\node_modules" >> $env:GITHUB_ENV

      - name: 마이그레이터 음성시험 (win32 DACL 검증 포함)
        run: node interactive/scripts/test-migrate-runtime-dir.mjs

      # doctor 음성시험은 가짜 CLI를 Windows PATHEXT(.cmd 래퍼)로 주입한다 — win 전용.
      # doctor 본체는 여전히 CI 제외(러너에 실설치 상태가 없음) — 이 시험은 스텁만 쓴다.
      - name: doctor 음성시험 (판정 규칙 · 비밀 무출력 · 배선 3분류)
        run: node interactive/scripts/test-doctor.mjs

  vsp-build:
    # vsp-custom 편입(D-030/D-037) — 레포 내 vsp/ 서브트리에서 in-repo 재현 빌드 +
    # 오프라인 계약 스모크. 바이너리는 비커밋(lock binary.build_command로 재현)이라
    # CI가 매번 빌드해 명령 계약을 assert한다. 온라인 명령(deploy/atc/test 등)은
    # SAP 자격증명·네트워크 부재로 여기서 못 돈다 — 오프라인 3종 + 파서 패키지 테스트만.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: vsp/go.mod
          cache-dependency-path: vsp/go.sum

      - name: build (vsp · CGO0 · trimpath)
        working-directory: vsp
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -o build/vsp ./cmd/vsp

      - name: 오프라인 계약 스모크 — lint (Error만 비-0, clean 파일 exit 0)
        working-directory: vsp
        run: ./build/vsp lint --file embedded/abap/zadt_test_simple_report.prog.abap

      - name: 오프라인 계약 스모크 — parse (exit 0)
        working-directory: vsp
        run: ./build/vsp parse --file embedded/abap/zadt_test_simple_report.prog.abap

      - name: 오프라인 계약 스모크 — execute --help gated write 문구
        working-directory: vsp
        run: ./build/vsp execute --help | grep -i "write permissions"

      - name: 검증 중심 계약 핵심 패키지 테스트 (abaplint · CGO0 green 실측)
        working-directory: vsp
        run: CGO_ENABLED=0 go test ./pkg/abaplint/...
