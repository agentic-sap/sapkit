# Offline structure/integrity/safety gates (S3 · D-027 로드맵 §9.7).
#
# 원칙: 여기 있는 게이트는 **assert**한다. 상태를 출력만 하고 항상 exit 0인 게이트는
# 안전 표면이 회귀해도 초록이라 없느니만 못하다(로드맵 §15).
#
# S3에서 달라진 것:
#   - smoke-mcp가 관찰에서 assertion으로 바뀌었다.
#   - 엔진 소스 테스트와 provenance 검사를 편입했다.
#     (그때의 「엔진」은 구 `engine/` 포크였다. 2026-08-19 교체(D-095) 뒤 제품 엔진은
#      `sapkit-engine`이고, 그 잡은 아래 `sapkit-engine`이다. 롤백 소스의 건강을
#      확인하던 `engine-tests` 잡은 **판7.5(2026-08-22)에서 제거했다** — 그 소스가
#      레포를 떠났기 때문이다.)
#
# 은퇴 (이식 장부): sc4sap 이식 provenance 게이트(check-migration-snapshot)와 그 음성시험을
# 이 워크플로에서 제거했다. **이식 시대가 끝났고** 이후 콘텐츠는 원본에서 의도적으로
# 갈라지므로 "원본 대응이 유지되는가"라는 질문 자체가 존재 이유를 잃었다. 콘텐츠 무결성은
# git 이력이 담당한다. 이식 완료 기록(`interactive/provenance/` 스냅샷 ·
# `interactive/MIGRATION-MANIFEST.md`)은 갱신 의무 없는 역사로 보존한다.
#
# 여전히 CI에 없는 것 (러너에 존재하지 않는 상태를 읽음 — 로컬 전용):
#   - doctor.mjs → 설치된 CLI 버전·플러그인 설치·훅 배선을 본다. 러너엔 무의미.
#   - 살아있는 SAP을 대상으로 하는 검증 → 자격증명·네트워크 부재. 로컬/에스코트 전용.
name: offline-gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-engine-provenance가 `git log -1 -- sapkit-engine/src …`로 번들 소스 최종
          # 커밋을 찾는다. 얕은 클론(기본 depth 1)이면 이력이 없어 오판한다.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: check-links
        run: node interactive/scripts/check-links.mjs interactive

      - name: 번들 무결성 (VERSION ↔ integrity.json ↔ 바이트)
        run: node interactive/server/verify-engine.mjs

      - name: 엔진 provenance (소스 커밋 ↔ 번들)
        run: node interactive/scripts/check-engine-provenance.mjs

      - name: 검사기 provenance (sapkit-cli 소스 커밋 ↔ 번들 · 소스 표류 0)
        # check-engine-provenance와 같은 이유로 여기 있다 — sourceCommit이 HEAD의
        # 조상인지 `git merge-base --is-ancestor`로 재므로 얕은 클론이면 오판한다.
        run: node interactive/scripts/verify-checker.mjs

      - name: 검사기 게이트 음성시험 (번들 오염·버전 어긋남·소스 표류를 실제로 거부하는지)
        # 이 잡에 있는 이유는 위와 같다 — ③(sourceCommit 실재·HEAD 조상) 케이스가
        # 실제 git 이력을 쓰므로 얕은 클론에서는 판정이 무의미하다.
        run: node interactive/scripts/test-verify-checker.mjs

      - name: MCP 도구 표면 계약 (readonly mutation 0 · row-data · 어댑터 deny)
        run: node interactive/scripts/smoke-mcp.mjs

      - name: 표면 게이트 음성시험
        run: node interactive/scripts/test-smoke-mcp.mjs

      # ── 서버 자체 안전 게이트 (설계 2026-08-02-claude-onboarding… §7-2 · §14-1) ──
      # 훅이 기본 0개가 되면 안전의 정본은 서버 번들뿐이다(R-RUNTIME). smoke-mcp가
      # "무엇이 보이는가"(tools/list 이름 집합)를 고정한다면, 아래 둘은 "보이는 것을
      # **호출하면** 서버가 막는가"를 고정한다.
      #
      # 러너에서 안전한 이유: 임시 HOME/USERPROFILE + 임시 프로파일 fixture만 쓰고,
      # 상속 env의 SAP_*/MCP_*/SAPKIT_*를 지운 뒤 번들을 띄운다. 대상 SAP은
      # `http://127.0.0.1:1`(아무도 listen하지 않는 루프백)이라 게이트를 통과한 호출은
      # 즉시 ECONNREFUSED로 끝난다 — 그 차이가 "막혔다 vs SAP로 나갔다"의 증거다.
      # 자격증명·네트워크 없이 도는 오프라인 게이트이므로 OS 의존이 없다.
      - name: 서버 안전 게이트 적합성 (tier · blocklist · inspection-only 정직 실패)
        run: node interactive/scripts/conformance-server-gates.mjs

      # 훅은 기본 미설치지만 **되돌릴 스위치**가 곧 안전 기능이다(R-SWITCH).
      # 스위치가 손상된 채 출시되는 것은 설계 §14-3의 출시 불가 조건이다.
      - name: 훅 스위치 왕복 (install-hooks 설치·제거 멱등 · 타 설정 보존 · 밖 무접촉)
        run: node interactive/scripts/test-hook-switch.mjs

      # 스위치가 성한 것과 **판정이 성한 것**은 다른 질문이다. 위 시험은 설치·제거
      # 메커니즘만 재고, 「어떤 페이로드에 어떤 판정이 나오는가」는 아무도 재지 않았다.
      # 이 러너가 훅을 자식 프로세스로 띄워 stdin에 PreToolUse JSON을 넣고 stdout
      # 판정을 단언한다 — 훅 재저작의 회귀 기준으로 채록한 74케이스다(D-089 ⓔ).
      # 임시 fixture만 쓰므로 오프라인이고 머신 상태에 의존하지 않는다.
      - name: 훅 판정 채록 (fail-closed 2종 · fail-open 1종 · advisory 1종 · 74케이스)
        run: node interactive/scripts/test-hook-decisions.mjs

      # ── setup·패키징 결정론 (설계 §8-2 · §6 방식 ④ — 2026-08-02) ─────────────
      # 셋 다 임시 디렉터리 fixture만 쓰는 오프라인 시험이다. setup-state는 홈을
      # SAPKIT_HOME_DIR 스텁으로 격리하고, codex-wire는 가짜 캐시 트리로 재작성을
      # 검증하며, launch-toolsurface는 자식 env에서 실사용자 홈 변수를 지운다.
      - name: setup 상태 mutator 음성시험 (byte-noop · 비밀 거부 · 부분 실패 롤백)
        run: node interactive/scripts/test-setup-state.mjs

      - name: launcher toolSurface 음성시험 (fail-closed 표 · 인자 우선순위)
        run: node interactive/scripts/test-launch-toolsurface.mjs

      - name: Codex wrapper 배선 도구 음성시험 (토큰 치환 · 멱등 · 스테일 수리)
        run: node interactive/scripts/test-codex-wire-mcp.mjs

      # ── 런타임 경로 (D-057 · 설계 §7-2·§7-3) ─────────────────────────────────
      # 둘 다 오프라인이고 러너에 있는 상태만 읽는다. 적합성 러너는 임시 트리에서
      # 실물 소비자(리졸버·훅 2종·launch shim·extract)를 구동하며, launch 실기동
      # 스모크는 프로필이 없는 cwd라 SAP에 접속하지 않는다.
      #
      # 이행기 호환층은 R5에서 제거됐다 — 마이그레이터와 그 음성시험, 그리고
      # 그 시험만 요구하던 dotenv probe 스텝이 함께 은퇴했다.
      - name: 개명 완료 게이트 (활성 구역에 구 세대 토큰 없음 · 안전 앵커)
        run: node interactive/scripts/check-runtime-path-rename.mjs

      - name: 개명 게이트 음성시험 (토큰 주입·앵커 제거를 실제로 거부하는지)
        run: node interactive/scripts/test-check-runtime-path-rename.mjs

      - name: 런타임 경로 적합성 (소비자별 해석 규칙 · 안전 회귀 5종)
        run: node interactive/scripts/conformance-runtime-dir.mjs

      - name: 플러그인 매니페스트·MCP 생성물 7종 ↔ 단일 정본
        run: node interactive/scripts/gen-plugin-manifests.mjs --check

      # ── 웜 레이어 줄 수 상한 (설계 2026-08-23-project-brain-design §3 · 판B ·
      # 판C에서 대상 인자화) ──────────────────────────────────────────────────
      # 문서가 불어나면 살아있는 규칙이 과거 기록에 묻힌다 — 착수 시점 실측이
      # HANDOFF 4,808줄 · RUN-PLAN 1,964줄이었다. 상한만 재고(목표치는 넣지 않는다),
      # 초과분은 삭제가 아니라 아카이브 이사로 줄이라고 안내한다.
      # 대상·상한·아카이브 경로는 게이트 안의 상수가 아니라 **아래 인자**가 정본이며
      # CLAUDE.md 게이트 절과 같은 값이다. 인자 없이 부르면 위반이 아니라 exit 2다.
      # (루트는 --root 기본값 = 잡의 작업 디렉터리 = 레포 루트를 그대로 쓴다.)
      - name: 웜 레이어 줄 수 상한 (HANDOFF ≤500 · RUN-PLAN ≤300)
        run: node interactive/scripts/check-doc-size.mjs --file HANDOFF.md:500:docs/reference/handoff-archive/ --file docs/RUN-PLAN.md:300:docs/reference/run-archive/

      - name: 줄 수 게이트 음성시험 (초과·부재·무인자를 실제로 거부하는지 · 경계 정확)
        run: node interactive/scripts/test-check-doc-size.mjs

      # ── 연속성 스위치·훅 음성시험 (판C) ────────────────────────────────────
      # 사용자 프로젝트의 재개점 2종을 가리키는 SessionStart 훅과 그 **별도** 스위치.
      # 재는 것: 스위치 왕복(멱등 upsert · --uninstall byte 원복 · 남의 항목 보존) ·
      # 안전훅 6종과의 양방향 독립 · 소유 판별 결정표(표식 없는 동명 파일이 하나라도
      # 있으면 무음 · 스캔 창 20줄 경계) · 본문 무유출.
      - name: 연속성 훅/스위치 음성시험 (왕복 · 안전훅 독립 · 결정표 · 무본문 주입)
        run: node interactive/scripts/test-continuity-hook.mjs

      # ── 콜드 층 위키 구조 게이트 (설계 2026-08-23-project-brain-design §2.11 ·
      # §4.6-5 · D-137 · 판W) ─────────────────────────────────────────────────
      # `docs/` 하위 링크를 재는 게이트가 이 레포에 없었다 — 기존 check-links.mjs의
      # 사정거리는 `interactive/`뿐이다. 이 게이트가 **위키 구역에 한해** 그 구멍을
      # 메운다(전면 확대는 별건). 재는 것: 위키 구역 링크 무결성 · 콜드 전수 고아
      # 검출(분모는 위키가 아니라 `docs/reference/**` 전체에서 아카이브 2종 내부와
      # INDEX 자신을 뺀 것) · D-번호 인용 실재 · 파생물 배너 · 부재=위반 · 발견
      # 배선 앵커.
      - name: 콜드 층 위키 구조 게이트 (링크 · 콜드 전수 고아 · D-번호 · 배너 · 부재 · 배선 앵커)
        run: node scripts/check-wiki.mjs

      - name: 위키 게이트 음성시험 (판정 6종이 실제로 거부하는지)
        run: node scripts/test-check-wiki.mjs

      # ── 공방 훅층 음성시험 (`.claude/hooks/` — 판B에서 git 추적으로 편입) ─────
      # 제품 어댑터 훅이 아니라 **이 레포의 개발 세션**을 지키는 층이다. 둘 다
      # 표준 라이브러리만 쓰고 훅을 자식 프로세스로 띄워 stdin 판정을 단언한다 —
      # 러너 기본 탑재 python3로 충분하며 전용 셋업 스텝이 필요 없다.
      - name: 백틱 가드 음성시험 (셸 치환 컨텍스트 deny · 정상 명령 통과 · 기존 패턴 회귀)
        run: python3 .claude/hooks/test-block-dangerous-bash.py

      - name: 세션 시작 훅 음성시험 (재개점·원격 대조 주입 · R1 유물 미주입)
        run: python3 .claude/hooks/test-session-start-context.py

      - name: git diff --check (공백/충돌 마커)
        run: git diff --check HEAD


  # (Track A PowerShell 검사기 스위트를 돌리던 windows 잡은 R1에서 제거됐다 —
  #  그 스위트가 루트 스크립트 디렉터리와 함께 삭제됐기 때문이다.)

  win-gates:
    # windows 전용 경로를 CI에서 실제로 통과시키는 잡. (구 `win-migrate-gate` —
    # 마이그레이터 음성시험이 R5에서 은퇴하며 doctor 음성시험만 남아 개명했다.)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # doctor 음성시험은 가짜 CLI를 Windows PATHEXT(.cmd 래퍼)로 주입한다 — win 전용.
      # doctor 본체는 여전히 CI 제외(러너에 실설치 상태가 없음) — 이 시험은 스텁만 쓴다.
      - name: doctor 음성시험 (판정 규칙 · 비밀 무출력 · 배선 3분류)
        run: node interactive/scripts/test-doctor.mjs

  # (구 `vsp/` 서브트리를 재현 빌드하던 `vsp-build` 잡은 vsp 은퇴 판에서 제거됐다 —
  #  setup-go 포함. 그 잡이 지키던 lint/parse 오프라인 계약은 아래 `sapkit-cli` 잡이
  #  자체 저작 검사기로 이어받는다. Go 툴체인은 이 레포에서 더 이상 쓰이지 않는다.)

  sapkit-cli:
    # 자체 저작 오프라인 ABAP 검사기(청사진 사다리 ⑵ · T8). 구 `vsp/`가 담당하던
    # lint/parse/analyze/check를 **대체 완료**했다 — SAP 무접속.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sapkit-cli/package-lock.json

      - name: install (sapkit-cli)
        working-directory: sapkit-cli
        run: npm ci

      - name: build · typecheck · test
        working-directory: sapkit-cli
        run: npm run verify

      - name: 코퍼스 대조 게이트 (구 vsp 판정 채록본 ↔ 신 CLI 판정, 갈림 0)
        working-directory: sapkit-cli
        run: npm run gates

      - name: 게이트 음성시험 (게이트가 정말 거부하는지 — 이 러너는 harness/에 있어 `npm run gates`가 돌리지 않는다)
        working-directory: sapkit-cli
        run: |
          node harness/test-corpus-gate.mjs
          node harness/test-compare-baseline.mjs

      - name: 기준 커버리지 (코퍼스 전 파일 × 표면 3종 누락 0 · 대장 실측 기록 일치)
        working-directory: sapkit-cli
        run: node harness/check-baseline-coverage.mjs

      # ── exit 계약 양극 assert (README 명령표의 계약) ────────────────────────
      # 통과만 확인하면 늘 exit 0을 돌려주는 CLI도 통과한다 — 그래서 Error/미해결
      # 픽스처 쪽은 **CLI가 실제로 비-0을 냈는지**를 `!`로 뒤집어 확인한다.
      - name: exit 계약 — 깨끗한 픽스처 lint → 0
        working-directory: sapkit-cli
        run: node bin/sapkit.js lint fixtures/corpus/synthetic/rules/empty_statement_neg.abap

      - name: exit 계약 — Error 픽스처 lint → 비-0
        working-directory: sapkit-cli
        run: '! node bin/sapkit.js lint fixtures/corpus/synthetic/rules/empty_statement_pos.abap'

      - name: exit 계약 — check 미해결 Z-인클루드 → 비-0
        working-directory: sapkit-cli
        run: '! node bin/sapkit.js check src/cli/__tests__/fixtures/check/missing-z'

  sapkit-engine:
    # 자체 저작 엔진(청사진 사다리 ⑴ · D-079 → **제품 · D-095**).
    #
    # 판7-b 전에는 "병행 제작 중인 물건"을 재는 잡이었다. 지금은 **제품 번들의 소스**를
    # 재는 잡이다 — 여기가 빨개지면 배포되는 엔진이 빨간 것이다.
    #
    # 이 머신에서 spawn 다발 시험이 자식 프로세스 수거에서 비결정적으로 블록된
    # 실측 기록이 있다(HANDOFF.md) — 그때 판정 자리를 대신하는 것이 이 잡이다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-engine-provenance --rebuild가 `git log -1 -- sapkit-engine/src …`로
          # 번들 소스 최종 커밋을 찾는다. 얕은 클론이면 이력이 없어 오판한다.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sapkit-engine/package-lock.json

      - name: install (sapkit-engine)
        working-directory: sapkit-engine
        run: npm ci

      - name: build · typecheck · test
        working-directory: sapkit-engine
        run: npm run verify

      - name: 자체 적합성 게이트 (표면 ⓐ~ⓓ · 카탈로그 · 안전 · 대장 · HTTP/SSE 기동)
        working-directory: sapkit-engine
        # 산출물에 대고 돈다 — verify가 방금 빌드했다. `npm run gates`와 같은 명령이다.
        #
        # 표면 게이트는 M1 19종 정확 일치가 아니라 **등록점 기준**으로 판정한다
        # (gates/surface.mjs 머리주석 ⓐ~ⓓ). 도구를 묶음으로 지어 나가는 동안에도
        # 이 잡이 계속 초록이어야 한다 — 전 기간 빨간 게이트는 곧 무시되고, 무시된
        # 게이트를 유일한 상시 증거로 삼은 판은 무증거다.
        run: node gates/run-all.mjs

      - name: 게이트 음성시험 (게이트가 정말 거부하는지)
        working-directory: sapkit-engine
        run: node gates/test-gates.mjs

      - name: 진척 대장 --check (생성기 자신의 입구로도 판정한다)
        working-directory: sapkit-engine
        # 판정 자체는 위 「대장」 게이트와 같다. 여기서 한 번 더 도는 것은 **사람이
        # 손으로 치는 그 명령**이 실제로 도는지를 CI가 보증하기 위해서다 — 생성기
        # 입구가 깨지면 대장을 다시 만들 길이 막히고, 그러면 대장이 낡은 채 굳는다.
        run: node harness/render-ledger.mjs --check

      - name: 제작 계획 --check (요구 급 인하를 손으로 못 고치게)
        working-directory: sapkit-engine
        # 판6.3(D-098 ⓒ)이 요구 급 **인하**를 집행하면서 `build-plan.json`이 「어느 도구의
        # 요구를 낮췄는가」를 담게 됐다. 그런데 이 `--check`는 그때까지 `npm run gates`에도
        # CI에도 없었고, **그 구멍이 실측으로 드러났다**: `build-plan.json`을 손으로 고쳐
        # 인하를 한 종 늘리고 대장을 재생성하면 대장 게이트·`render-ledger --check`·표면
        # 게이트가 **전부 초록**이었다(판6.3 최종 독립 리뷰 A1 · 사보타주 S26).
        # 인하는 「증거가 아니라 요구를 낮춘 것」이라 손으로 늘리면 수치가 조용히 좋아진다.
        # 위 스텝들이 이미 `npm ci && npm run build`를 마쳤으므로 `dist/`가 있다.
        run: node harness/build-plan.mjs --check

      - name: 기동 스모크 (산출물을 자식 프로세스로 띄워 stdio 왕복)
        working-directory: sapkit-engine
        # 시험은 전송을 주입해 같은 프로세스에서 돈다 — 그건 로직 증거이지
        # 실려 나가는 물건이 뜬다는 증거가 아니다. SAP 무접속.
        run: node gates/stdio-smoke.mjs

      - name: 번들 스모크 (제품에 실리는 단일 파일이 뜨고 스탬프·표면이 맞는가)
        working-directory: sapkit-engine
        # `verify`가 방금 `build:bundle`까지 돌렸으므로 dist/server.bundle.cjs가 있다.
        # 번들을 **임시 디렉터리로 옮겨** 띄운다 — dist/에 둔 채 띄우면 판 스탬프가
        # 빠져도 폴백이 sapkit-engine/package.json을 만나 단언이 공허해진다.
        run: node gates/bundle-smoke.mjs

      - name: 키체인 폴백 스모크 (네이티브 모듈 부재 → inspection-only 강등 · 크래시 0)
        working-directory: sapkit-engine
        # `secrets.ts`의 `nativeReader()`는 try/catch require로 fail-closed지만,
        # 기존 시험은 전부 reader를 **주입**해 그 갈래를 흉내 냈다 — 실제
        # `require('@napi-rs/keyring')`가 실패하는 경로는 한 번도 실행된 적이 없다.
        # 이 스모크가 그 자리를 판다: 주입 없는 해석 + `keychain:` 참조 프로파일로
        # 산출물 실기동.
        #
        # **`npm ci --omit=optional` 트리를 따로 깔지 않는다.** production 코드가 그
        # 모듈과 닿는 자리는 require 한 곳뿐이고, 스모크는 `Module._load`를 그 이름에만
        # 걸어 같은 `MODULE_NOT_FOUND`를 같은 자리에 세운다 — 관측 가능한 차이가 없다.
        # 오히려 증거로는 더 강하다: 가로채기가 걸렸다는 사실이 남으므로 「require가
        # 실제로 시도됐다」까지 증명한다(모듈이 없는 트리는 코드가 require를 아예
        # 부르지 않아도 똑같이 초록이라 그걸 증명하지 못한다). 설치가 0이므로 위
        # 스텝들의 npm ci 트리도 건드리지 않는다.
        #
        # 루프백에 리스너를 세워 **프로파일 주소로 들어온 접속을 센다** — 0건이
        # "해석하지 못한 참조로 로그온을 쌓지 않았다"의 증거다. SAP 무접속.
        run: node gates/keyring-fallback-smoke.mjs

      - name: 거부 어휘 병행 인식 확인 (D18 — 판5 E2 방어 시험)
        working-directory: sapkit-engine
        # 제품 게이트의 무접속 분류 정규식을 **읽어 와**(복제 없음) 구·신 거부
        # 문구 양쪽에 대입한다. 누군가 alternation을 좁혀 되돌리면 여기서 빨개진다.
        run: node gates/test-refusal-vocab.mjs

      - name: attended 녹화 관문 음성시험 (저장 자리 3분기 · 무접속 어휘 · 기본 저장 자리)
        working-directory: sapkit-engine
        # 판7-b 교체 뒤 녹화 관문의 규칙이 바뀌었다: `fixtures/attended-only/`는 **제품
        # 엔진 이름을 요구**하고, 재생 기준선 `fixtures/`는 **무조건 거부**한다(신 엔진이
        # 제 응답을 제 기준으로 삼는 자기 대조라 증거가 아니다). 이 관문의 판정 일부는
        # **SAP 호출이 전부 나간 뒤**에 돌기 때문에, 느슨해지면 대가를 실 SAP이 치른다.
        # 그래서 「거부해야 할 입력이 정말 거부되는가」를 상시로 잰다. SAP 무접속 ·
        # dist 불요(소스와 임시 파일만 본다).
        run: node gates/test-attended-guard.mjs

      # (구 번들 발행 표면 표류 확인 스텝은 판7-b에서 내렸다. 그 질문 — "구 번들이
      #  여전히 이렇게 발행하는가" — 은 구 번들이 현역일 때만 뜻이 있었다. 교체 뒤
      #  `engine/`은 아무도 고치지 않는 롤백 자산이라 그 대조는 동어반복이었다.
      #  **판7.5(2026-08-22)에서 그 소스가 레포를 떠났다** — 그래서 채록본
      #  `harness/old-surface/m1-tools.json`은 이제 **되뜰 수 없는 기준**이다
      #  (`sapkit-cli/fixtures/baseline/`과 같은 지위). 그것을 상시로 지키는 것은
      #  `gates/surface.mjs`이고, **재채록 수단은 더 이상 없다** — 되뜨려면 git
      #  이력에서 은퇴 직전 커밋 `2264f89d`를 참조한다.)

      - name: 번들 재현 빌드 (같은 커밋 → 같은 바이트) + 소스 커밋 대조
        # 제품 번들의 provenance 판정이다. 이 잡에 있는 이유는 둘 — devDeps(tsc/esbuild)가
        # 여기 깔려 있고, 판정이 실 git 이력을 쓰므로 fetch-depth: 0이 필요하다.
        # working-directory는 레포 루트(기본값)로 되돌린다.
        run: node interactive/scripts/check-engine-provenance.mjs --rebuild

      # ── 번들 ↔ 소스 대조 (구 「교체 관문」 · BLUEPRINT 검증 기준 2가 서던 자리) ──
      # 아래 둘은 **제품 게이트를 dist/ 산출물에 겨눈 것**이다. 교체(D-095) 전에는 이
      # 인자가 "구 번들 vs 신 엔진"을 갈랐고 그것이 기준 2의 증거였다. 지금 `bundle`과
      # `engine`은 **같은 엔진의 두 형태**다 — node-gates가 도는 무인자(`bundle`)는
      # 제품이 싣는 단일 파일이고, 여기 둘은 그 파일을 만든 소스의 tsc 산출물이다.
      # 그래서 이 둘이 재는 것은 이제 **번들링이 표면·안전 집행을 떨어뜨리지 않았는가**이고,
      # 갈리면 번들러를 의심할 자리다. 잡이 여기인 이유는 그대로다: 이 잡이 방금
      # dist/를 빌드했다. working-directory는 레포 루트(기본값)로 되돌린다.
      - name: 번들↔소스 대조 ①  도구 표면 계약 (같은 엔진의 두 형태)
        # 대조 기준은 구·신 공용인 제품 계약(interactive/provenance/mcp-surface.json)이다.
        # 신 엔진이 제 채록본으로 자기를 채점하지 않는다는 것이 이 단언의 값어치다.
        run: node interactive/scripts/smoke-mcp.mjs --target=engine

      - name: 번들↔소스 대조 ②  서버 안전 게이트 (같은 엔진의 두 형태)
        # tier 집행 · 테이블 blocklist · ask 왕복 · inspection-only 정직 실패.
        # 옛 GAP-2(blocklist 노브가 프로세스 env로 안 들던 것)는 교체로 닫혔고,
        # B2p·B2p2·B2p3가 그 자리를 정식 단언으로 덮는다 — 「푸는 노브가 든다」
        # 「조이는 노브가 든다」 「같은 키면 활성 프로파일이 이긴다」.
        run: node interactive/scripts/conformance-server-gates.mjs --target=engine
